<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billings | Rationalizer V2.2</title>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; font-family: monospace; }
        #overlay { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; border-left: 2px solid #00ffcc; padding-left: 10px; z-index: 10; }
    </style>
</head>
<body>
    <div id="overlay">
        <div style="font-size: 10px; color: #444; letter-spacing: 2px;">PANEL OPTIMIZATION</div>
        <div style="font-size: 16px;">BILLINGS RATIONALIZER V2.2</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const params = {
            runSim: true,
            flux: 2.5,
            baseScale: 0.45,
            hexMode: false,
            hue: 0.55,
            metalness: 1.0
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 12, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- LIGHTING ---
        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(10, 20, 10);
        const rim = new THREE.PointLight(0x00ffcc, 15, 30);
        rim.position.set(-10, 5, -10);
        scene.add(sun, rim, new THREE.AmbientLight(0x111111));

        const count = 3600;
        const discGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 24);
        const discMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1 });
        const iMesh = new THREE.InstancedMesh(discGeo, discMat, count);
        scene.add(iMesh);

        const baseGeo = new THREE.SphereGeometry(5, 60, 60);
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        let currentTime = 0;

        function update(time) {
            if (params.runSim) currentTime = time; // Only update internal clock if sim is running

            const pos = baseGeo.attributes.position;
            const norm = baseGeo.attributes.normal;
            
            for (let i = 0; i < count; i++) {
                const vIdx = i % pos.count;
                let x = pos.getX(vIdx), y = pos.getY(vIdx), z = pos.getZ(vIdx);

                // Organic Surface Flux
                const noise = Math.sin(x * 0.4 + currentTime) * Math.cos(z * 0.4 + currentTime);
                const bulge = 1 + (noise * params.flux * 0.1);
                
                // Hex Stagger Logic
                let posX = x * bulge;
                let posY = y * bulge;
                let posZ = z * bulge;
                
                if(params.hexMode && (Math.floor(vIdx / 60) % 2 === 0)) {
                    posX += 0.1; // Simple stagger for hex feel
                }

                dummy.position.set(posX, posY, posZ);
                
                // Align to Normal
                const n = new THREE.Vector3(norm.getX(vIdx), norm.getY(vIdx), norm.getZ(vIdx));
                dummy.lookAt(dummy.position.clone().add(n));
                dummy.rotateX(Math.PI/2);
                
                const s = params.baseScale + (noise * 0.2);
                dummy.scale.set(s, 1, s);
                
                dummy.updateMatrix();
                iMesh.setMatrixAt(i, dummy.matrix);

                color.setHSL(params.hue + (noise * 0.05), 0.9, 0.5);
                iMesh.setColorAt(i, color);
            }
            iMesh.instanceMatrix.needsUpdate = true;
            iMesh.instanceColor.needsUpdate = true;
        }

        const pane = new Tweakpane.Pane({ title: 'Rationalization Controls' });
        pane.addInput(params, 'runSim', { label: 'Simulation Active' });
        pane.addSeparator();
        pane.addInput(params, 'flux', { min: 0, max: 6, label: 'Surface Flux' });
        pane.addInput(params, 'baseScale', { min: 0.1, max: 0.8, label: 'Disc Diameter' });
        pane.addInput(params, 'hexMode', { label: 'Hex Stagger' });
        pane.addInput(params, 'hue', { min: 0, max: 1, label: 'Anodized Hue' });

        function animate(t) {
            requestAnimationFrame(animate);
            controls.update();
            update(t * 0.0006);
            renderer.render(scene, camera);
        }
        animate(0);
    </script>
</body>
</html>
