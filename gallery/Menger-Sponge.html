<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Fractal Engine</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
        canvas { display: block; }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            color: #666; font-family: monospace; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Calculating...</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 20, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5); // Closer view

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x0044ff, 0.5);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);

        // --- STATE ---
        const params = {
            shape: 'Sierpinski Tetra', // Default to the one we are fixing
            level: 3,
            color: '#00ffff',
            wireframe: false,
            opacity: 1.0,
            autoRotate: true
        };

        let mesh;
        const dummy = new THREE.Object3D();
        const infoDiv = document.getElementById('info');

        // --- MATH ENGINES ---

        // 1. MENGER SPONGE (Cube) - Unchanged
        function getMengerMatrices(size, level) {
            const matrices = [];
            function recurse(x, y, z, s, l) {
                if (l === 0) {
                    dummy.position.set(x, y, z);
                    dummy.scale.set(s, s, s);
                    dummy.rotation.set(0,0,0);
                    dummy.updateMatrix();
                    matrices.push(dummy.matrix.clone());
                    return;
                }
                const newSize = s / 3;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        for (let k = -1; k <= 1; k++) {
                            let zeroCount = 0;
                            if (i === 0) zeroCount++;
                            if (j === 0) zeroCount++;
                            if (k === 0) zeroCount++;
                            if (zeroCount < 2) {
                                recurse(x + i*newSize, y + j*newSize, z + k*newSize, newSize, l - 1);
                            }
                        }
                    }
                }
            }
            recurse(0, 0, 0, size, level);
            return matrices;
        }

        // 2. SIERPINSKI TETRAHEDRON (FIXED)
        function getTetraMatrices(size, level) {
            const matrices = [];
            
            // Exact vertices of a regular tetrahedron inscribed in unit sphere
            // Rotated to sit flat on XZ plane
            const r = 1;
            const h = r * Math.sqrt(2/3); // Height of apex
            const dy = -h/4; // Center offset to make (0,0,0) the volumetric center
            
            // The 4 vectors pointing to the corners (Normalized directions)
            const corners = [
                new THREE.Vector3(0, 1, 0),                         // Top
                new THREE.Vector3(0.9428, -0.3333, 0),              // Base 1
                new THREE.Vector3(-0.4714, -0.3333, 0.8165),        // Base 2
                new THREE.Vector3(-0.4714, -0.3333, -0.8165)        // Base 3
            ];

            function recurse(cx, cy, cz, s, l) {
                if (l === 0) {
                    dummy.position.set(cx, cy, cz);
                    dummy.scale.set(s, s, s);
                    dummy.rotation.set(0, 0, 0); 
                    dummy.updateMatrix();
                    matrices.push(dummy.matrix.clone());
                    return;
                }

                // Child scale is half of current
                const nextS = s * 0.5;
                // Distance to move children from center
                // We move 1/2 of the current 'radius' (s) towards the corners
                const dist = (s * 0.5); 

                // Spawn 4 children
                // Note: The base geometry (TetrahedronGeometry) has radius 1.
                // We just need to push the centers.
                
                // Due to how Three.js orients the TetrahedronGeometry(1),
                // The vertices aren't perfectly aligned to [0,1,0]. 
                // We will rely on geometric translation rather than vertex matching.
                
                // Let's use the explicit vectors defined above which form a perfect tetra
                for(let i=0; i<4; i++) {
                    const dir = corners[i].clone().multiplyScalar(dist); // Scale vector by size
                    recurse(cx + dir.x, cy + dir.y, cz + dir.z, nextS, l - 1);
                }
            }

            // Start recursion
            // size param here acts as the scale multiplier
            recurse(0, 0, 0, size, level);
            return matrices;
        }


        // --- BUILDER ---
        function buildStructure() {
            if (mesh) { scene.remove(mesh); mesh.dispose(); }

            infoDiv.innerText = `Calculating Level ${params.level}...`;
            
            setTimeout(() => {
                let matrices = [];
                let geometry;

                if (params.shape === 'Menger Sponge') {
                    const safeLevel = Math.min(params.level, 4); 
                    geometry = new THREE.BoxGeometry(1, 1, 1);
                    matrices = getMengerMatrices(3, safeLevel); 
                } else {
                    const safeLevel = Math.min(params.level, 7);
                    
                    // Use standard Geometry
                    // We need to rotate the base geometry so it matches our vector logic (Tip Up)
                    geometry = new THREE.TetrahedronGeometry(1);
                    geometry.rotateX(-Math.PI / 2); // Orient tip up
                    geometry.rotateZ(Math.PI / 4);  // Align base to axes better
                    
                    // Actually, let's just rotate it until it looks like a pyramid
                    // Trial and error alignment to match the calculation vectors
                    geometry.dispose(); 
                    geometry = new THREE.TetrahedronGeometry(1);
                    
                    // Rotate geometry to align Vertex 0 to Top (0,1,0)
                    // ThreeJS Tetra default: Vertex 0 is at (1,1,1).
                    // We use a helper rotation to align it.
                    const aligner = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(-Math.atan(Math.sqrt(2)) + Math.PI/2, 0, Math.PI/4));
                    // The above manual rotation logic is complex. 
                    // Simpler: Just match the offsets to the geometry's actual vertices!
                    
                    // RE-CALCULATING VECTORS DYNAMICALLY:
                    const tempGeo = new THREE.TetrahedronGeometry(1);
                    const pos = tempGeo.attributes.position;
                    const dynamicCorners = [];
                    // Get first 4 unique points (Vertices)
                    // Three.js non-indexed tetra has 12 vertices (4 faces * 3).
                    // We just need the 4 unique spatial coordinates.
                    // V1 (0,1,2), V2(3,4,5)...
                    // We can just pick index 0, 1, 2, and maybe 9?
                    // Let's grab unique ones.
                    
                    const uniquePoints = [];
                    for(let i=0; i<pos.count; i++){
                        const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                        let exists = false;
                        for(let u of uniquePoints) { if(u.distanceTo(v) < 0.01) exists = true; }
                        if(!exists) uniquePoints.push(v);
                    }
                    
                    // Now recurse using THESE exact vectors
                    matrices = []; // Clear
                    function recurseSimple(cx, cy, cz, s, l) {
                        if (l === 0) {
                            dummy.position.set(cx, cy, cz);
                            dummy.scale.set(s, s, s);
                            dummy.rotation.set(0, 0, 0); 
                            dummy.updateMatrix();
                            matrices.push(dummy.matrix.clone());
                            return;
                        }
                        const nextS = s * 0.5;
                        // Move halfway to each of the 4 unique corners
                        for(let i=0; i<4; i++) {
                            const v = uniquePoints[i].clone().multiplyScalar(s * 0.5); // Direction * half scale
                            recurseSimple(cx + v.x, cy + v.y, cz + v.z, nextS, l - 1);
                        }
                    }
                    recurseSimple(0,0,0, 3, safeLevel); // Size 3
                }

                const material = new THREE.MeshStandardMaterial({
                    color: params.color,
                    roughness: 0.4,
                    metalness: 0.5,
                    wireframe: params.wireframe,
                    transparent: true,
                    opacity: params.opacity
                });

                mesh = new THREE.InstancedMesh(geometry, material, matrices.length);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                for (let i = 0; i < matrices.length; i++) {
                    mesh.setMatrixAt(i, matrices[i]);
                }
                
                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
                
                infoDiv.innerText = `Objects: ${matrices.length.toLocaleString()} | Level: ${params.level}`;
            }, 10);
        }

        // --- ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            controls.autoRotate = params.autoRotate;
            controls.update();
            renderer.render(scene, camera);
        }

        // --- UI ---
        const pane = new Tweakpane.Pane({ title: 'Fractal Engine' });
        
        pane.addInput(params, 'shape', {
            options: { 'Sierpinski (Pyramid)': 'Sierpinski Tetra', 'Menger Sponge (Cube)': 'Menger Sponge' }
        }).on('change', buildStructure);

        pane.addInput(params, 'level', { min: 1, max: 7, step: 1, label: 'Recursion Depth' }).on('change', (ev) => {
            if (params.shape === 'Menger Sponge' && ev.value > 4) {
                alert("Warning: Menger Level 5 is unsafe.");
                params.level = 4; pane.refresh();
            }
            buildStructure();
        });

        const fVis = pane.addFolder({ title: 'Visuals' });
        fVis.addInput(params, 'color', { label: 'Material' }).on('change', () => mesh.material.color.set(params.color));
        fVis.addInput(params, 'wireframe', { label: 'X-Ray' }).on('change', () => mesh.material.wireframe = params.wireframe);
        fVis.addInput(params, 'opacity', { min: 0.1, max: 1.0 }).on('change', () => mesh.material.opacity = params.opacity);
        fVis.addInput(params, 'autoRotate', { label: 'Rotate' });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        buildStructure();
        animate();

    </script>
</body>
</html>
