<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schling Engine | Asymptotic Gridshell</title>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: monospace; }
        #overlay { position: absolute; top: 20px; left: 20px; color: #ffcc00; pointer-events: none; border-left: 2px solid #ffcc00; padding-left: 10px; z-index: 10; }
    </style>
</head>
<body>
    <div id="overlay">
        <div style="font-size: 10px; color: #666; letter-spacing: 2px;">RESEARCH: EIKE SCHLING</div>
        <div style="font-size: 16px;">ASYMPTOTIC GRID GENERATOR</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const params = {
            saddle: 1.5,
            density: 20,
            showSurface: true,
            color: '#ffcc00'
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const matSurface = new THREE.MeshPhongMaterial({ color: 0x111111, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const matLine = new THREE.LineBasicMaterial({ color: 0xffcc00 });

        let gridGroup = new THREE.Group();
        let surfaceMesh;
        scene.add(gridGroup);
        scene.add(new THREE.AmbientLight(0x404040), new THREE.DirectionalLight(0xffffff, 1));

        function generateAsymptotic() {
            if (surfaceMesh) scene.remove(surfaceMesh);
            while(gridGroup.children.length > 0) gridGroup.remove(gridGroup.children[0]);

            // 1. Create a hyperbolic paraboloid (Saddle Surface)
            // Asymptotic curves exist on surfaces with negative Gaussian curvature
            const size = 10;
            const res = 50;
            const geometry = new THREE.PlaneGeometry(size, size, res, res);
            const pos = geometry.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                // z = (x^2 - y^2) * k
                let z = (Math.pow(x, 2) - Math.pow(y, 2)) * (params.saddle / 25);
                pos.setZ(i, z);
            }
            geometry.computeVertexNormals();
            surfaceMesh = new THREE.Mesh(geometry, matSurface);
            surfaceMesh.rotateX(-Math.PI/2);
            if(params.showSurface) scene.add(surfaceMesh);

            // 2. Trace Asymptotic Lines
            // On a saddle, asymptotic lines are roughly diagonal
            const lineRes = params.density;
            for (let i = 0; i <= lineRes; i++) {
                const points1 = [], points2 = [];
                for (let j = 0; j <= res; j++) {
                    const t = (j / res) * size - size/2;
                    const offset = (i / lineRes) * size - size/2;

                    // Family A
                    points1.push(new THREE.Vector3(t, (t + offset + size/2) % size - size/2, 0));
                    // Family B
                    points2.push(new THREE.Vector3(t, (-(t + offset) + size/2) % size - size/2, 0));
                }

                // Project lines onto surface
                [points1, points2].forEach(pts => {
                    pts.forEach(p => {
                        p.z = (Math.pow(p.x, 2) - Math.pow(p.y, 2)) * (params.saddle / 25);
                    });
                    const lGeom = new THREE.BufferGeometry().setFromPoints(pts);
                    const line = new THREE.Line(lGeom, new THREE.LineBasicMaterial({color: params.color}));
                    line.rotateX(-Math.PI/2);
                    gridGroup.add(line);
                });
            }
        }

        const pane = new Tweakpane.Pane({ title: 'Schling Geometry' });
        pane.addInput(params, 'saddle', { min: 0.1, max: 5, label: 'Curvature Depth' }).on('change', generateAsymptotic);
        pane.addInput(params, 'density', { min: 5, max: 40, step: 1 }).on('change', generateAsymptotic);
        pane.addInput(params, 'showSurface');
        pane.addInput(params, 'color');

        generateAsymptotic();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
