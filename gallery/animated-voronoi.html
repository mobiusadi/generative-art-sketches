<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Animated Glass</title>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .home-btn {
            position: fixed; top: 20px; left: 20px;
            color: #000; text-decoration: none; font-family: monospace;
            font-size: 14px; z-index: 1000; opacity: 0.5; transition: 0.3s;
            border: 1px solid rgba(127,127,127,0.3);
            padding: 5px 10px; background: rgba(255,255,255,0.8);
        }
        .home-btn:hover { opacity: 1.0; background: #000; color: #fff; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">← Home</a>
    <canvas id="canvas"></canvas>

    <script>
        // --- 1. SETUP ---
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        const params = {
            count: 50,
            speed: 0.2,        // Movement speed
            lineWidth: 2,
            lineColor: '#111111',
            
            // DOTS (The new addition)
            showDots: false,
            dotSize: 4,
            dotColor: '#ff0000',

            // Colors
            mode: 'Manual',
            baseColor: '#264653',
            c1: '#264653',
            c2: '#2a9d8f',
            c3: '#e9c46a',
            c4: '#e76f51'
        };

        let width, height;
        let agents = [];

        // --- 2. AGENT SYSTEM ---
        function initAgents() {
            agents = [];
            for (let i = 0; i < params.count; i++) {
                agents.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 2, // Velocity X (-1 to 1)
                    vy: (Math.random() - 0.5) * 2, // Velocity Y (-1 to 1)
                    colorTag: Math.floor(Math.random() * 4) // 0, 1, 2, or 3
                });
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Only re-init if agents are empty or drastic change, 
            // but usually we just want them to keep moving.
            if(agents.length === 0) initAgents(); 
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // A. Update Color Palette
            let palette = [];
            if (params.mode === 'Manual') {
                palette = [params.c1, params.c2, params.c3, params.c4];
            } else {
                const base = d3.hsl(params.baseColor);
                palette = [
                    base.formatHex(),
                    d3.hsl(base.h, base.s, Math.min(1, base.l + 0.15)).formatHex(), 
                    d3.hsl(base.h, base.s, Math.min(1, base.l + 0.30)).formatHex(), 
                    d3.hsl(base.h, base.s, Math.min(1, base.l + 0.45)).formatHex() 
                ];
            }

            // B. Physics Update
            agents.forEach(agent => {
                agent.x += agent.vx * params.speed;
                agent.y += agent.vy * params.speed;

                // Bounce
                if (agent.x <= 0 || agent.x >= width) agent.vx *= -1;
                if (agent.y <= 0 || agent.y >= height) agent.vy *= -1;
            });

            // C. Calculate Voronoi
            const points = agents.map(a => [a.x, a.y]);
            const delaunay = d3.Delaunay.from(points);
            const voronoi = delaunay.voronoi([0, 0, width, height]);

            // D. Render
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, width, height);

            context.lineWidth = params.lineWidth;
            context.strokeStyle = params.lineColor;

            // Draw Cells
            for (let i = 0; i < agents.length; i++) {
                context.beginPath();
                voronoi.renderCell(i, context);
                
                // Color based on the agent's persistent tag
                context.fillStyle = palette[agents[i].colorTag];
                context.fill();
                context.stroke();
            }

            // Draw Dots (if enabled)
            if (params.showDots) {
                context.fillStyle = params.dotColor;
                for (let i = 0; i < agents.length; i++) {
                    context.beginPath();
                    context.arc(agents[i].x, agents[i].y, params.dotSize, 0, Math.PI * 2);
                    context.fill();
                }
            }
        }

        // --- 4. CONTROLS ---
        const pane = new Tweakpane.Pane({ title: 'Animated Glass' });

        const f1 = pane.addFolder({ title: 'Motion & Geometry' });
        f1.addInput(params, 'count', { min: 10, max: 200, step: 1 }).on('change', initAgents);
        f1.addInput(params, 'speed', { min: 0, max: 5 });
        f1.addInput(params, 'lineWidth', { min: 0.5, max: 10 });
        
        const fDots = pane.addFolder({ title: 'Points / Nodes' });
        fDots.addInput(params, 'showDots');
        fDots.addInput(params, 'dotSize', { min: 1, max: 20 });
        fDots.addInput(params, 'dotColor');

        const f2 = pane.addFolder({ title: 'Colors' });
        f2.addInput(params, 'lineColor');
        f2.addInput(params, 'mode', { options: { Manual: 'Manual', Monochrome: 'Monochrome' } });
        
        f2.addInput(params, 'c1', { label: 'Color A' });
        f2.addInput(params, 'c2', { label: 'Color B' });
        f2.addInput(params, 'c3', { label: 'Color C' });
        f2.addInput(params, 'c4', { label: 'Color D' });
        f2.addSeparator();
        f2.addInput(params, 'baseColor', { label: 'Mono Base' });

        // Kickoff
        initAgents();
        animate();

    </script>
</body>
</html>
