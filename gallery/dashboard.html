<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generative Archive</title>
  <style>
    body { 
      margin: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #121212; 
      color: #ffffff; 
    }
    h1 { 
      text-align: center; 
      margin: 40px 0 20px 0; 
      font-weight: 300; 
      letter-spacing: 4px; 
      color: #e0e0e0;
    }
    
    /* The Grid System */
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 25px; 
      padding: 30px; 
      max-width: 1400px; 
      margin: 0 auto; 
    }
    
    /* The Cards */
    .card { 
      background: #1e1e1e; 
      border-radius: 8px; 
      overflow: hidden; 
      cursor: pointer; 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
    }
    .card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 8px 15px rgba(0,0,0,0.8); 
    }
    .thumbnail { 
      width: 100%; 
      height: 280px; 
      background: #2a2a2a; 
      object-fit: cover; 
      display: block;
    }
    .title { 
      padding: 15px; 
      font-size: 16px; 
      text-align: center; 
      color: #b0b0b0; 
      letter-spacing: 1px;
    }
    
    /* The Fullscreen Pop-up (Modal) */
    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.95); 
      z-index: 1000; 
      flex-direction: column; 
    }
    #modal-close { 
      align-self: flex-end; 
      margin: 15px 25px; 
      font-size: 40px; 
      cursor: pointer; 
      color: white; 
      border: none; 
      background: transparent; 
      transition: color 0.2s;
    }
    #modal-close:hover { color: #f7941d; }
    #viewer { 
      width: 95%; 
      height: 85%; 
      margin: 0 auto; 
      border: none; 
      background: white; 
      border-radius: 4px; 
    }
  </style>
</head>
<body>

  <h1>GENERATIVE ARCHIVE</h1>

  <div class="gallery">
    <!-- Card 1: Origami -->
    <div class="card" onclick="openSketch('sketch-origami.html')">
      <!-- Using ../ to point to the PNGs in the main sketches folder -->
      <img class="thumbnail" src="../2026.02.05-17.43.19.png" onerror="this.src='https://via.placeholder.com/300x300/2a2a2a/777777?text=No+Thumbnail'">
      <div class="title">Origami Shatter</div>
    </div>
    
    <!-- Card 2: Morphing Train -->
    <div class="card" onclick="openSketch('sketch-moprh-train.html')">
      <img class="thumbnail" src="../2026.02.05-17.38.38.png" onerror="this.src='https://via.placeholder.com/300x300/2a2a2a/777777?text=No+Thumbnail'">
      <div class="title">Morphing Train</div>
    </div>

    <!-- Card 3: Ashlar Advanced -->
    <div class="card" onclick="openSketch('A1-ashlar-advanced-export.html')">
      <img class="thumbnail" src="../2025.11.06-14.32.02.png" onerror="this.src='https://via.placeholder.com/300x300/2a2a2a/777777?text=No+Thumbnail'">
      <div class="title">Ashlar A1 Plot</div>
    </div>
    
    <!-- Card 4: Template for a new sketch -->
    <div class="card" onclick="openSketch('sketch-voronoi.html')">
      <img class="thumbnail" src="missing.png" onerror="this.src='https://via.placeholder.com/300x300/2a2a2a/777777?text=No+Thumbnail'">
      <div class="title">Voronoi Pattern</div>
    </div>
  </div>

  <!-- The Hidden Viewer -->
  <div id="modal">
    <button id="modal-close" onclick="closeSketch()">&times;</button>
    <iframe id="viewer" src=""></iframe>
  </div>

  <script>
    // Functions to handle the pop-up viewer
    function openSketch(url) {
      document.getElementById('viewer').src = url;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeSketch() {
      document.getElementById('viewer').src = '';
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
