<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Maritime Skyscraper</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: monospace; }
        #canvas-container { width: 100%; height: 100%; }
        
        /* The Floating Schedule */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            padding: 15px;
            pointer-events: none;
            color: #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #fff; text-transform: uppercase; }
        h2 { margin: 0 0 10px 0; font-size: 12px; color: #0ff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
        .header { color: #888; border-bottom: 1px solid #444; margin-bottom: 8px; padding-bottom: 2px; }
        .highlight { color: #ffcc00; font-weight: bold; }
        .val { color: #fff; }
        
        /* Highlight specific panel types */
        .type-row { border-left: 3px solid transparent; padding-left: 5px; }
        .type-active { border-left: 3px solid #ffcc00; background: rgba(255, 204, 0, 0.1); }
        
        #total-stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="hud">
        <h1>Maritime Tower</h1>
        <h2 id="floor-title">Floor 1 Schedule</h2>
        <div id="schedule-content">Loading...</div>
        <div id="total-stats"></div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- STATE ---
        const params = {
            divisions: 24,
            method: 'Equal Arc',
            
            // Tower Geometry
            floors: 5,
            aBase: 8.0,
            bBase: 4.5,
            floorHeight: 4.0,
            offset: 0.25, // Flare per floor
            
            // View / Selection
            viewFloor: 1, // 1-based index for UI
            panelIndex: 0,
            
            // Visuals
            showGlass: true,
            showMullions: true,
            tolerance: 0.002
        };

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 20, 150);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 30, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 50, 20);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x0088ff, 0.5);
        backLight.position.set(-10, 5, -10);
        scene.add(backLight);

        // Groups
        const geoGroup = new THREE.Group();
        scene.add(geoGroup);

        // --- MATH ENGINE ---
        function getEllipsePoint(t, a, b) {
            return { x: a * Math.cos(t), y: b * Math.sin(t) };
        }

        function generateRing(a, b, N, method) {
            let ringPoints = [];
            if (method === 'Parametric (Naive)') {
                for (let i = 0; i <= N; i++) {
                    const t = (i / N) * Math.PI * 2;
                    ringPoints.push(getEllipsePoint(t, a, b));
                }
            } else {
                const steps = 2000;
                let totalLen = 0;
                let prevP = getEllipsePoint(0, a, b);
                const dt = (Math.PI * 2) / steps;
                const distMap = [{ dist: 0, t: 0 }];
                for (let i = 1; i <= steps; i++) {
                    const t = i * dt;
                    const p = getEllipsePoint(t, a, b);
                    const d = Math.sqrt((p.x - prevP.x)**2 + (p.y - prevP.y)**2);
                    totalLen += d;
                    distMap.push({ dist: totalLen, t: t });
                    prevP = p;
                }
                const segmentLen = totalLen / N;
                ringPoints.push(getEllipsePoint(0, a, b));
                for (let i = 1; i < N; i++) {
                    const targetDist = i * segmentLen;
                    for(let k=0; k<distMap.length-1; k++) {
                        if (distMap[k].dist <= targetDist && distMap[k+1].dist > targetDist) {
                            const ratio = (targetDist - distMap[k].dist) / (distMap[k+1].dist - distMap[k].dist);
                            const foundT = distMap[k].t + (distMap[k+1].t - distMap[k].t) * ratio;
                            ringPoints.push(getEllipsePoint(foundT, a, b));
                            break;
                        }
                    }
                }
                ringPoints.push(getEllipsePoint(Math.PI*2, a, b));
            }
            return ringPoints;
        }

        // --- GEOMETRY BUILDER ---
        // Stores data for all floors: [Floor1Data, Floor2Data...]
        let towerData = []; 

        function updateGeometry() {
            geoGroup.clear();
            towerData = [];

            // 1. Generate All Rings (Floor 0 to Floor N)
            // Ring i is at height i * floorHeight
            const rings = [];
            for (let f = 0; f <= params.floors; f++) {
                const currentA = params.aBase + (f * params.offset);
                const currentB = params.bBase + (f * params.offset);
                const pts = generateRing(currentA, currentB, params.divisions, params.method);
                rings.push({ pts: pts, height: f * params.floorHeight });
            }

            // 2. Build Floors
            let totalPanels = 0;

            for (let f = 0; f < params.floors; f++) {
                // Determine if this floor is the one being viewed in HUD
                // We use 1-based index for viewFloor
                const isViewFloor = (f + 1) === params.viewFloor;
                
                // Color Coding
                const glassColor = isViewFloor ? 0x00ffff : 0x004488;
                const glassOpacity = isViewFloor ? 0.8 : 0.3;
                const lineColor = isViewFloor ? 0xffffff : 0x444444;

                const floorPanels = [];
                const uniqueTypes = [];
                
                const ptsLower = rings[f].pts;
                const hLower = rings[f].height;
                
                const ptsUpper = rings[f+1].pts;
                const hUpper = rings[f+1].height;

                const vertices = [];
                const linePoints = [];

                for (let i = 0; i < params.divisions; i++) {
                    // Geometry Construction
                    const p1 = new THREE.Vector3(ptsLower[i].x, hLower, ptsLower[i].y);
                    const p2 = new THREE.Vector3(ptsLower[i+1].x, hLower, ptsLower[i+1].y);
                    const p4 = new THREE.Vector3(ptsUpper[i].x, hUpper, ptsUpper[i].y);
                    const p3 = new THREE.Vector3(ptsUpper[i+1].x, hUpper, ptsUpper[i+1].y);

                    // Calculations
                    const wBottom = p1.distanceTo(p2);
                    const wTop = p4.distanceTo(p3);
                    const slantH = p1.distanceTo(p4);
                    
                    // Warp calc
                    const tri1 = new THREE.Triangle(p1, p2, p4);
                    const tri2 = new THREE.Triangle(p2, p3, p4);
                    const n1 = new THREE.Vector3(); tri1.getNormal(n1);
                    const n2 = new THREE.Vector3(); tri2.getNormal(n2);
                    const warp = n1.angleTo(n2) * (180/Math.PI);

                    const pData = { id: i, floor: f, wBottom, wTop, slantH, warp };
                    floorPanels.push(pData);

                    // Grouping Logic for this floor
                    let foundGroup = false;
                    for(let g of uniqueTypes) {
                        if (Math.abs(g.wBottom - wBottom) < params.tolerance && 
                            Math.abs(g.wTop - wTop) < params.tolerance && 
                            Math.abs(g.slantH - slantH) < params.tolerance) {
                            g.count++;
                            g.ids.push(i);
                            foundGroup = true;
                            break;
                        }
                    }
                    if(!foundGroup) uniqueTypes.push({ wBottom, wTop, slantH, count: 1, ids: [i] });

                    // Visuals
                    if (isViewFloor && i === params.panelIndex) {
                        // Highlight Selected Panel
                        const hMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide, transparent:true, opacity:0.6 });
                        const hGeo = new THREE.BufferGeometry();
                        const v = [p1.x,p1.y,p1.z, p2.x,p2.y,p2.z, p4.x,p4.y,p4.z, p2.x,p2.y,p2.z, p3.x,p3.y,p3.z, p4.x,p4.y,p4.z];
                        hGeo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
                        hGeo.computeVertexNormals();
                        geoGroup.add(new THREE.Mesh(hGeo, hMat));
                    } else if (params.showGlass) {
                        vertices.push(p1.x,p1.y,p1.z, p2.x,p2.y,p2.z, p4.x,p4.y,p4.z, p2.x,p2.y,p2.z, p3.x,p3.y,p3.z, p4.x,p4.y,p4.z);
                    }

                    if (params.showMullions) {
                        linePoints.push(p1, p4); 
                        linePoints.push(p4, p3);
                        if(f === 0) linePoints.push(p1, p2); // Draw bottom ring only on floor 0
                    }
                }

                // Create Floor Meshes
                if (vertices.length > 0) {
                    const gMat = new THREE.MeshPhysicalMaterial({
                        color: glassColor,
                        metalness: 0.1, roughness: 0.1, transmission: 0.6,
                        transparent: true, opacity: glassOpacity, side: THREE.DoubleSide
                    });
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    geo.computeVertexNormals();
                    geoGroup.add(new THREE.Mesh(geo, gMat));
                }

                if (linePoints.length > 0) {
                    const lMat = new THREE.LineBasicMaterial({ color: lineColor });
                    const lGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                    geoGroup.add(new THREE.LineSegments(lGeo, lMat));
                }

                towerData.push({ floor: f, panels: floorPanels, types: uniqueTypes });
                totalPanels += floorPanels.length;
            }

            // Update HUD with data from the 'viewFloor'
            const activeFloorIdx = params.viewFloor - 1;
            // Guard against reducing floors slider while viewing high floor
            if (towerData[activeFloorIdx]) {
                updateHUD(towerData[activeFloorIdx], params.panelIndex, totalPanels);
            }
        }

        function updateHUD(floorData, selectedPanelId, totalTowerPanels) {
            const hudTitle = document.getElementById('floor-title');
            const hudContent = document.getElementById('schedule-content');
            const hudStats = document.getElementById('total-stats');

            hudTitle.innerText = `LEVEL ${floorData.floor + 1} SCHEDULE`;
            
            // Sort types
            const types = floorData.types.sort((a,b) => b.wBottom - a.wBottom);

            let html = `
                <div class="header row">
                    <span style="width:30px">TYPE</span>
                    <span style="width:60px">BOT</span>
                    <span style="width:60px">TOP</span>
                    <span style="width:40px">QTY</span>
                </div>
            `;

            types.forEach((t, i) => {
                const isActive = t.ids.includes(selectedPanelId);
                const typeName = `P${floorData.floor+1}-${String(i+1).padStart(2,'0')}`;
                
                html += `
                    <div class="row type-row ${isActive ? 'type-active' : ''}">
                        <span style="width:40px; color:${isActive?'#fc0':'#888'}">${typeName}</span>
                        <span class="val" style="width:60px">${t.wBottom.toFixed(3)}</span>
                        <span class="val" style="width:60px">${t.wTop.toFixed(3)}</span>
                        <span class="val" style="width:40px">${t.count}</span>
                    </div>
                `;
            });

            // Selection Details
            const currentPanel = floorData.panels[selectedPanelId];
            html += `<br><div class="header">SELECTION (Panel #${selectedPanelId+1})</div>`;
            html += `
                <div class="row">
                    <span>Slant Height:</span>
                    <span class="highlight">${currentPanel.slantH.toFixed(3)} m</span>
                </div>
                <div class="row">
                    <span>Warpage:</span>
                    <span style="color:${currentPanel.warp > 0.5 ? '#f05' : '#0f8'}">${currentPanel.warp.toFixed(2)}°</span>
                </div>
            `;
            
            hudContent.innerHTML = html;

            hudStats.innerHTML = `
                BUILDING STATS:<br>
                Total Floors: ${params.floors}<br>
                Total Panels: ${totalTowerPanels}<br>
                Total Height: ${(params.floors * params.floorHeight).toFixed(1)}m
            `;
        }

        // --- UI ---
        const pane = new Tweakpane.Pane({ title: 'Maritime Skyscraper' });
        
        pane.addInput(params, 'method', { options: { 'Equal Arc': 'Equal Arc', 'Parametric (Naive)': 'Parametric (Naive)' } }).on('change', updateGeometry);
        pane.addInput(params, 'divisions', { min: 8, max: 60, step: 1 }).on('change', () => { params.panelIndex = 0; updateGeometry(); });
        
        const fTower = pane.addFolder({ title: 'Tower Definition' });
        fTower.addInput(params, 'floors', { min: 1, max: 10, step: 1 }).on('change', (ev) => {
            // Keep viewFloor within bounds
            if(params.viewFloor > ev.value) params.viewFloor = ev.value;
            updateGeometry();
        });
        fTower.addInput(params, 'floorHeight', { min: 2, max: 6 }).on('change', updateGeometry);
        fTower.addInput(params, 'offset', { min: 0, max: 1.5, label: 'Flare/Floor' }).on('change', updateGeometry);
        fTower.addInput(params, 'aBase', { min: 4, max: 15 }).on('change', updateGeometry);
        fTower.addInput(params, 'bBase', { min: 4, max: 15 }).on('change', updateGeometry);

        const fView = pane.addFolder({ title: 'Schedule & View' });
        fView.addInput(params, 'viewFloor', { min: 1, max: 10, step: 1, label: 'View Floor' }).on('change', (ev) => {
            // Clamp to max floors
            if(ev.value > params.floors) params.viewFloor = params.floors;
            updateGeometry();
        });
        fView.addInput(params, 'panelIndex', { min: 0, max: 60, step: 1, label: 'Select Panel' }).on('change', (ev) => {
            if(ev.value >= params.divisions) params.panelIndex = params.divisions - 1;
            updateGeometry();
        });
        fView.addInput(params, 'tolerance', { min: 0.0001, max: 0.01, step: 0.0001 }).on('change', updateGeometry);

        const fVis = pane.addFolder({ title: 'Visuals' });
        fVis.addInput(params, 'showGlass').on('change', updateGeometry);
        fVis.addInput(params, 'showMullions').on('change', updateGeometry);
        fVis.addInput({ autoRotate: true }, 'autoRotate').on('change', (ev) => { controls.autoRotate = ev.value; });

        // Init
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        updateGeometry();
        animate();

    </script>
</body>
</html>
