<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Architectural Intelligence | 3D Logic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b1015; font-family: 'Helvetica Neue', Arial, sans-serif; }
        canvas { display: block; outline: none; }
        
        /* OVERLAY TEXT */
        .overlay {
            position: absolute; bottom: 30px; left: 30px; pointer-events: none;
            color: #fff; z-index: 10;
        }
        .overlay h1 {
            font-size: 14px; letter-spacing: 2px; margin: 0; text-transform: uppercase;
            color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        .overlay p {
            font-size: 10px; color: #8899aa; margin: 4px 0 0 0; letter-spacing: 1px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
</head>
<body>

    <div class="overlay">
        <h1>Architectural Intelligence</h1>
        <p>SPATIAL CONFIGURATOR // GEN 2</p>
    </div>

    <script>
        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b1015, 0.0025); // Deep fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.set(0, 100, 400);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimise for mobile
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        // --- 2. THE SYSTEM ---
        const BOID_COUNT = 600;
        let boids = [];
        
        // PARAMETERS (The DNA)
        const params = {
            seed: 'Chaos',
            align: 1.0,
            cohesion: 0.8,
            separation: 1.2,
            perception: 60,
            speed: 3.0,
            color: '#00ffff'
        };

        // Geometry (Instanced for performance)
        const geometry = new THREE.ConeGeometry(2, 8, 4);
        geometry.rotateX(Math.PI / 2); // Point forward
        let material = new THREE.MeshLambertMaterial({ color: params.color });
        let mesh = new THREE.InstancedMesh(geometry, material, BOID_COUNT);
        scene.add(mesh);
        
        const dummy = new THREE.Object3D();

        // --- 3. SEED GENERATORS (The Architectural Forms) ---
        function resetBoids(type) {
            boids = [];
            for(let i=0; i<BOID_COUNT; i++) {
                let pos = new THREE.Vector3();
                let vel = new THREE.Vector3();

                if (type === 'Chaos') {
                    // Random Cube
                    pos.set(
                        (Math.random()-0.5)*400,
                        (Math.random()-0.5)*400,
                        (Math.random()-0.5)*400
                    );
                } 
                else if (type === 'Sphere') {
                    // Points on a sphere surface
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const r = 150; // Radius
                    pos.x = r * Math.sin(phi) * Math.cos(theta);
                    pos.y = r * Math.sin(phi) * Math.sin(theta);
                    pos.z = r * Math.cos(phi);
                }
                else if (type === 'Torus') {
                    // Donut Shape
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    const R = 150; // Main radius
                    const r = 40;  // Tube radius
                    pos.x = (R + r * Math.cos(v)) * Math.cos(u);
                    pos.y = (R + r * Math.cos(v)) * Math.sin(u);
                    pos.z = r * Math.sin(v);
                }
                else if (type === 'Column') {
                    // Vertical Cylinder
                    const theta = Math.random() * Math.PI * 2;
                    const r = Math.random() * 50;
                    const h = (Math.random() - 0.5) * 400;
                    pos.x = r * Math.cos(theta);
                    pos.y = h; // Vertical axis
                    pos.z = r * Math.sin(theta);
                }

                // Random starting velocity
                vel.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(params.speed);

                boids.push({ pos, vel, acc: new THREE.Vector3() });
            }
        }

        // Initialize first state
        resetBoids('Chaos');

        // --- 4. THE PHYSICS ENGINE ---
        function updateBoids() {
            const center = new THREE.Vector3();
            
            // Loop through every boid
            for(let i=0; i<BOID_COUNT; i++) {
                let boid = boids[i];
                let align = new THREE.Vector3();
                let cohesion = new THREE.Vector3();
                let separation = new THREE.Vector3();
                let total = 0;

                // Check neighbors (O(N^2) - okay for <1000 particles)
                for(let j=0; j<BOID_COUNT; j++) {
                    let other = boids[j];
                    if (i === j) continue;
                    
                    let dist = boid.pos.distanceTo(other.pos);
                    if (dist < params.perception) {
                        align.add(other.vel);
                        cohesion.add(other.pos);
                        
                        let diff = new THREE.Vector3().subVectors(boid.pos, other.pos);
                        diff.divideScalar(dist); // Weight by inverse distance
                        separation.add(diff);
                        
                        total++;
                    }
                }

                if (total > 0) {
                    // 1. Alignment (Steer towards average heading)
                    align.divideScalar(total).setLength(params.speed).sub(boid.vel).multiplyScalar(0.05);
                    
                    // 2. Cohesion (Steer towards average position)
                    cohesion.divideScalar(total).sub(boid.pos).setLength(params.speed).sub(boid.vel).multiplyScalar(0.05);
                    
                    // 3. Separation (Steer away from crowding)
                    separation.divideScalar(total).setLength(params.speed).sub(boid.vel).multiplyScalar(0.1);
                }

                // Apply weights from UI
                boid.acc.add(align.multiplyScalar(params.align));
                boid.acc.add(cohesion.multiplyScalar(params.cohesion));
                boid.acc.add(separation.multiplyScalar(params.separation));

                // Soft boundary (Gravity well to center)
                if (boid.pos.length() > 250) {
                    boid.acc.add(boid.pos.clone().multiplyScalar(-0.0005));
                }
            }

            // Move Boids & Update Mesh
            for(let i=0; i<BOID_COUNT; i++) {
                let b = boids[i];
                b.vel.add(b.acc);
                b.vel.clampLength(1, params.speed * 1.5); // Limit max speed
                b.pos.add(b.vel);
                b.acc.set(0,0,0); // Reset forces

                // Update Instance Matrix
                dummy.position.copy(b.pos);
                // Look ahead
                let lookTarget = b.pos.clone().add(b.vel);
                dummy.lookAt(lookTarget);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateBoids();
            controls.update();
            renderer.render(scene, camera);
        }

        // --- 5. UI CONTROLS ---
        const pane = new Tweakpane.Pane({ title: 'Swarm Controls' });
        
        // Presets
        pane.addInput(params, 'seed', {
            options: { Chaos: 'Chaos', Sphere: 'Sphere', Torus: 'Torus', Column: 'Column' },
            label: 'Initial Form'
        }).on('change', (ev) => {
            resetBoids(ev.value);
        });

        pane.addSeparator();

        // Physics
        pane.addInput(params, 'align', { min: 0, max: 3, label: 'Alignment' });
        pane.addInput(params, 'cohesion', { min: 0, max: 3, label: 'Cohesion' });
        pane.addInput(params, 'separation', { min: 0, max: 3, label: 'Separation' });
        pane.addInput(params, 'speed', { min: 0.1, max: 10, label: 'Speed' });
        pane.addInput(params, 'perception', { min: 10, max: 150, label: 'Vision Radius' });
        
        // Color
        pane.addInput(params, 'color', { label: 'Boid Color' }).on('change', (ev) => {
            mesh.material.color.set(ev.value);
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
