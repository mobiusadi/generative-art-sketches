<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Reciprocal Structures</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        canvas { display: block; }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            color: #aaa; font-family: monospace; pointer-events: none;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="info">
        Reciprocal Frame Engine<br>
        1. Select Pattern (Wallis Square or Da Vinci Hex)<br>
        2. Increase "Reciprocity" to slide beams past each other
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 0); // Top-down view start

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // --- LIGHTS ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10, 30, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
        sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
        scene.add(sun);

        // --- STATE ---
        const params = {
            pattern: 'Wallis Grid (Square)', // or 'Da Vinci Dome (Hex)'
            reciprocity: 0.4,   // 0.0 to 1.0 (How much overlap/rotation)
            beamLength: 1.1,    // Extension past joint
            curvature: 0.0,     // Flat floor vs Dome
            density: 6,         // Grid size
            beamWidth: 0.15,
            beamDepth: 0.3,
            color: '#d2a679'    // Timber
        };

        let structureGroup = new THREE.Group();
        scene.add(structureGroup);

        // --- GENERATION ENGINE ---
        
        // Helper: Get Base Mesh Topology
        function getBaseTopology() {
            let geometry;
            
            if (params.pattern === 'Wallis Grid (Square)') {
                // PlaneGeometry gives us a grid of quads
                geometry = new THREE.PlaneGeometry(20, 20, params.density, params.density);
                geometry.rotateX(-Math.PI / 2); // Lay flat
            } else {
                // Icosahedron gives us triangles/hexagons for dome
                // Density controls subdivision detail
                const detail = Math.max(0, Math.floor(params.density / 3));
                geometry = new THREE.IcosahedronGeometry(10, detail);
                
                // Clip bottom half to make it a dome
                const pos = geometry.attributes.position;
                const newPos = [];
                // Simple hack: We'll just generate the full sphere and let the user view it
                // Or we can scale it flat if curvature is 0
            }
            return geometry;
        }

        function generateStructure() {
            structureGroup.clear();
            
            // 1. Get Base Mesh
            const baseGeo = getBaseTopology();
            
            // If we are in Square mode but want curvature, we bend the plane
            if (params.pattern === 'Wallis Grid (Square)') {
                const pos = baseGeo.attributes.position;
                for(let i=0; i<pos.count; i++){
                    const x = pos.getX(i);
                    const z = pos.getZ(i);
                    // Simple parabolic dome distortion
                    const dist = Math.sqrt(x*x + z*z);
                    const y = - (dist * dist) * 0.02 * params.curvature; 
                    pos.setY(i, y);
                }
                baseGeo.computeVertexNormals();
            } else {
                // Hex Mode: It's naturally spherical.
                // If curvature is low, we flatten the sphere
                if (params.curvature < 0.5) {
                    baseGeo.scale(1, params.curvature * 2 + 0.1, 1);
                }
            }

            // 2. Extract Edges (The potential beams)
            // We can't just use wireframe because we need connectivity info
            // Strategy: Iterate Faces.
            // Each Face is a cycle of beams.
            
            // Actually, Reciprocal frames are usually defined by rotating edges around the Vertex.
            // Let's implement the "Vertex Expansion" method.
            
            // Step A: Build adjacency list
            // For every vertex, which vertices is it connected to?
            const vertices = []; // Vector3s
            const posAttr = baseGeo.attributes.position;
            for(let i=0; i<posAttr.count; i++){
                vertices.push(new THREE.Vector3().fromBufferAttribute(posAttr, i));
            }
            
            // Get edges from index (if indexed) or position matching
            const edges = []; // Pairs of vertex indices [a, b]
            const indexAttr = baseGeo.index;
            
            if (indexAttr) {
                // Triangles
                for (let i = 0; i < indexAttr.count; i += 3) {
                    const a = indexAttr.getX(i);
                    const b = indexAttr.getX(i+1);
                    const c = indexAttr.getX(i+2);
                    edges.push([a, b], [b, c], [c, a]);
                }
            } else {
                // Non-indexed (Triangles soup)
                for (let i = 0; i < posAttr.count; i += 3) {
                    edges.push([i, i+1], [i+1, i+2], [i+2, i]);
                }
            }

            // Deduplicate edges (Mesh has double edges for shared sides)
            // Create unique string key "min-max"
            const uniqueEdges = new Map();
            edges.forEach(e => {
                const key = e[0] < e[1] ? `${e[0]}-${e[1]}` : `${e[1]}-${e[0]}`;
                if(!uniqueEdges.has(key)) {
                    // Store geometry info
                    uniqueEdges.set(key, { 
                        start: vertices[e[0]], 
                        end: vertices[e[1]] 
                    });
                }
            });

            // 3. Generate Beams (The Reciprocal Transform)
            const material = new THREE.MeshStandardMaterial({ 
                color: params.color, 
                roughness: 0.8,
                metalness: 0.1
            });

            const beamGeo = new THREE.BoxGeometry(1, params.beamWidth, params.beamDepth);
            const dummy = new THREE.Object3D();
            const instMesh = new THREE.InstancedMesh(beamGeo, material, uniqueEdges.size);
            instMesh.castShadow = true;
            instMesh.receiveShadow = true;
            
            let idx = 0;
            uniqueEdges.forEach((edgeData) => {
                const v1 = edgeData.start;
                const v2 = edgeData.end;
                
                // Calculate Center of the edge
                const center = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
                
                // Calculate Original Vector
                const vec = new THREE.Vector3().subVectors(v2, v1);
                const len = vec.length();
                
                // --- THE MAGIC: ROTATION ---
                // In a reciprocal frame, the beam doesn't go V1 -> V2.
                // It is rotated around the face normal or "up" vector to bypass the node.
                
                // Calculate "Up" (Normal of surface at this point)
                // For a flat grid, Up is (0,1,0). For dome, Up is Center->Normal.
                let up = new THREE.Vector3(0, 1, 0);
                if (params.pattern !== 'Wallis Grid (Square)' || params.curvature > 0.1) {
                    // Approximate normal by position (for sphere/dome)
                    up.copy(center).normalize(); 
                }

                // Rotate the vector 'vec' around 'up' by 'reciprocity' angle
                const angle = params.reciprocity * 1.0; // Scale effect
                vec.applyAxisAngle(up, angle);
                
                // Scale length (beams need to be longer to overlap!)
                // If reciprocity is 0 (vertices touch), length is L.
                // If reciprocity is high, beam must span the new gap.
                // We let user control extension.
                const finalLen = len * params.beamLength;

                // Position: The center stays the same (roughly)
                // Actually, strictly speaking, reciprocal grids move the centers too, 
                // but rotating around the edge center visually creates the correct pattern.
                
                // Align the dummy object
                dummy.scale.set(finalLen, 1, 1);
                dummy.position.copy(center);
                
                // Orientation
                // LookAt logic to align box with vector
                const lookTarget = new THREE.Vector3().addVectors(center, vec);
                dummy.lookAt(lookTarget);
                
                // Tweak: Vertical Offset?
                // In real reciprocal frames, beams stack vertically. 
                // We can simulate this by jittering Y slightly or calculating stack order.
                // For this vis, simple interpenetration looks okay, 
                // but let's try to shift based on rotation to hint at stacking.
                
                dummy.updateMatrix();
                instMesh.setMatrixAt(idx, dummy.matrix);
                idx++;
            });

            structureGroup.add(instMesh);
            baseGeo.dispose();
        }

        // --- UI ---
        const pane = new Tweakpane.Pane({ title: 'Reciprocal Engine' });
        
        pane.addInput(params, 'pattern', {
            options: { 'Wallis Grid (Square)': 'Wallis Grid (Square)', 'Da Vinci Dome (Hex)': 'Da Vinci Dome (Hex)' }
        }).on('change', generateStructure);

        const fGeo = pane.addFolder({ title: 'Geometry' });
        fGeo.addInput(params, 'reciprocity', { min: 0.0, max: 1.5, label: 'Reciprocity' }).on('change', generateStructure);
        fGeo.addInput(params, 'beamLength', { min: 1.0, max: 2.0, label: 'Beam Overlap' }).on('change', generateStructure);
        fGeo.addInput(params, 'curvature', { min: 0.0, max: 10.0, label: 'Dome Height' }).on('change', generateStructure);
        fGeo.addInput(params, 'density', { min: 2, max: 20, step: 1 }).on('change', generateStructure);
        
        const fStyle = pane.addFolder({ title: 'Timber' });
        // The fix: Add .on('change', generateStructure) to these inputs
        fStyle.addInput(params, 'beamWidth', { min: 0.05, max: 0.5 }).on('change', generateStructure);
        fStyle.addInput(params, 'beamDepth', { min: 0.1, max: 1.0 }).on('change', generateStructure);
        fStyle.addInput(params, 'color', { label: 'Wood Color' }).on('change', generateStructure);

        generateStructure();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
