<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Ruled Surface v2.5</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: monospace; }
        #canvas-container { width: 100%; height: 100%; }
        
        #hud {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid #444;
            padding: 15px; pointer-events: none; color: #ccc;
        }
        h1 { margin: 0 0 10px 0; font-size: 14px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        .val { color: #fff; font-weight: bold; }
        .highlight { color: #ffcc00; }
        .locked { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>
    <div id="hud">
        <h1>SURFACE DATA</h1>
        <div class="row"><span>Type:</span><span id="type-val" class="val">Hypar</span></div>
        <div class="row"><span>Dims:</span><span id="area-val" class="val">--</span></div>
        <div class="row"><span>Waist Radius:</span><span id="waist-val" class="highlight">--</span></div>
        <br>
        <div style="border-top:1px solid #444; margin-bottom:5px;"></div>
        <div class="row"><span>GRID LOGIC:</span></div>
        <div class="row"><span>Connection Step:</span><span id="step-val" class="val">--</span></div>
        <div class="row"><span>Max Warpage:</span><span id="warp-val" class="highlight">--</span></div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 20, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Grouping
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // Materials
        const lineMatA = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 }); // Family A (Cyan)
        const lineMatB = new THREE.LineBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.8 }); // Family B (Blue)
        const meshMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.5,
            metalness: 0.2, roughness: 0.2, wireframe: false 
        });
        const dimLineMat = new THREE.LineBasicMaterial({ color: 0x888888 });
        
        // --- PARAMS ---
        const params = {
            mode: 'Hyperboloid (Cylinder)',
            
            // Hypar
            width: 12.0, length: 12.0, hyparTwist: 4.0,
            
            // Cylinder
            cylRadius: 5.0,
            cylHeight: 12.0, 
            cylTwist: 60,   
            doubleRule: true,
            snapToNodes: false, // New Toggle
            
            // Detail
            divisions: 20,
            showMesh: true, 
            showLines: true, 
            showDims: true,
            opacity: 0.5 // New Slider
        };

        // --- GENERATION ---
        let lastMaxWarp = 0;

        function updateGeometry() {
            mainGroup.clear();
            
            // Update Material Opacity
            meshMat.opacity = params.opacity;

            if (params.mode === 'Hypar (Saddle)') {
                generateHypar();
                document.getElementById('type-val').innerText = "Hypar";
                document.getElementById('area-val').innerText = `${params.width.toFixed(1)}m x ${params.length.toFixed(1)}m`;
                document.getElementById('waist-val').innerText = "N/A";
                document.getElementById('step-val').innerText = "Grid (U/V)";
            } else {
                generateHyperboloid();
                document.getElementById('type-val').innerText = "Hyperboloid";
                document.getElementById('area-val').innerText = `R=${params.cylRadius}m x H=${params.cylHeight.toFixed(1)}m`;
            }
            
            const warpElem = document.getElementById('warp-val');
            warpElem.innerText = `${lastMaxWarp.toFixed(2)}°`;
            warpElem.style.color = lastMaxWarp > 1.0 ? '#ff0055' : '#00ff88';
        }

        function generateHypar() {
            const w = params.width / 2;
            const l = params.length / 2;
            const h = params.hyparTwist / 2; 

            const c0 = new THREE.Vector3(-w, -h, -l);
            const c1 = new THREE.Vector3( w,  h, -l);
            const c2 = new THREE.Vector3( w, -h,  l);
            const c3 = new THREE.Vector3(-w,  h,  l);

            // Dims
            if (params.showDims) {
                drawPost(c0, -h); drawPost(c1, h); drawPost(c2, -h); drawPost(c3, h);
                const baseGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-w, 0, -l), new THREE.Vector3(w, 0, -l),
                    new THREE.Vector3(w, 0, l), new THREE.Vector3(-w, 0, l),
                    new THREE.Vector3(-w, 0, -l)
                ]);
                mainGroup.add(new THREE.Line(baseGeo, new THREE.LineBasicMaterial({ color: 0x444444 })));
            }

            const segs = params.divisions;
            const vertices = []; 
            const indices = [];
            let maxWarp = 0;

            for (let i = 0; i <= segs; i++) {
                for (let j = 0; j <= segs; j++) {
                    const u = i / segs;
                    const v = j / segs;
                    const pTop = new THREE.Vector3().lerpVectors(c0, c1, u);
                    const pBot = new THREE.Vector3().lerpVectors(c3, c2, u);
                    const p = new THREE.Vector3().lerpVectors(pTop, pBot, v);
                    vertices.push(p.x, p.y, p.z);

                    if (i < segs && j < segs) {
                        const row = segs + 1;
                        const a = i * row + j;
                        const b = i * row + (j + 1);
                        const c = (i + 1) * row + j;
                        const d = (i + 1) * row + (j + 1);
                        indices.push(a, b, d); indices.push(a, d, c);
                        maxWarp = Math.max(maxWarp, calculateWarp(vertices, a, b, c, d));
                    }
                }
            }
            lastMaxWarp = maxWarp;
            
            if (params.showMesh) {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geo.setIndex(indices);
                geo.computeVertexNormals();
                geo.computeBoundingSphere(); 
                mainGroup.add(new THREE.Mesh(geo, meshMat));
            }

            if (params.showLines) {
                const linePts = [];
                for (let i = 0; i <= segs; i++) {
                    for (let j = 0; j < segs; j++) {
                        const idx1 = i * (segs + 1) + j;
                        const idx2 = i * (segs + 1) + (j + 1);
                        linePts.push(new THREE.Vector3(vertices[idx1*3], vertices[idx1*3+1], vertices[idx1*3+2]));
                        linePts.push(new THREE.Vector3(vertices[idx2*3], vertices[idx2*3+1], vertices[idx2*3+2]));
                    }
                }
                for (let j = 0; j <= segs; j++) {
                    for (let i = 0; i < segs; i++) {
                        const idx1 = i * (segs + 1) + j;
                        const idx2 = (i + 1) * (segs + 1) + j;
                        linePts.push(new THREE.Vector3(vertices[idx1*3], vertices[idx1*3+1], vertices[idx1*3+2]));
                        linePts.push(new THREE.Vector3(vertices[idx2*3], vertices[idx2*3+1], vertices[idx2*3+2]));
                    }
                }
                const lGeo = new THREE.BufferGeometry().setFromPoints(linePts);
                mainGroup.add(new THREE.LineSegments(lGeo, lineMatA));
            }
        }

        function generateHyperboloid() {
            const r = params.cylRadius;
            const h = params.cylHeight; 
            
            // --- SNAP LOGIC ---
            let activeTwist = params.cylTwist;
            const stepAngle = 360 / params.divisions;
            
            if (params.snapToNodes) {
                const steps = Math.round(activeTwist / stepAngle);
                activeTwist = steps * stepAngle;
                // Update HUD style
                const stepElem = document.getElementById('step-val');
                stepElem.innerText = `LOCKED: N to N+${steps}`;
                stepElem.className = 'val locked';
            } else {
                const steps = activeTwist / stepAngle;
                const stepElem = document.getElementById('step-val');
                stepElem.innerText = `~N to N+${steps.toFixed(1)}`;
                stepElem.className = 'val';
            }

            const twistRad = (activeTwist * Math.PI) / 180;
            const segs = params.divisions; 
            const stacks = params.divisions; 

            const vertices = [];
            const indices = [];
            let maxWarp = 0;

            const topY = h/2;
            const botY = -h/2;
            const botRot = -twistRad / 2;
            const topRot = twistRad / 2;

            for (let i = 0; i <= stacks; i++) {
                const t = i / stacks; 
                for (let j = 0; j <= segs; j++) {
                    const theta = (j / segs) * Math.PI * 2;
                    // Mesh Geometry
                    const bx = r * Math.cos(theta); const bz = r * Math.sin(theta);
                    const bx_rot = bx*Math.cos(botRot) - bz*Math.sin(botRot);
                    const bz_rot = bx*Math.sin(botRot) + bz*Math.cos(botRot);
                    const pStart = new THREE.Vector3(bx_rot, botY, bz_rot);

                    const tx = r * Math.cos(theta); const tz = r * Math.sin(theta);
                    const tx_rot = tx*Math.cos(topRot) - tz*Math.sin(topRot);
                    const tz_rot = tx*Math.sin(topRot) + tz*Math.cos(topRot);
                    const pEnd = new THREE.Vector3(tx_rot, topY, tz_rot);

                    const p = new THREE.Vector3().lerpVectors(pStart, pEnd, t);
                    vertices.push(p.x, p.y, p.z);

                    if (i < stacks && j < segs) {
                        const row = segs + 1;
                        const a = i * row + j;
                        const b = i * row + (j + 1);
                        const c = (i + 1) * row + j;
                        const d = (i + 1) * row + (j + 1);
                        indices.push(a, b, d); indices.push(a, d, c);
                        maxWarp = Math.max(maxWarp, calculateWarp(vertices, a, b, c, d));
                    }
                }
            }
            lastMaxWarp = maxWarp;
            
            // HUD Waist
            const midRow = Math.floor(stacks/2);
            const midIdx = midRow * (segs+1);
            const mx = vertices[midIdx*3];
            const mz = vertices[midIdx*3+2];
            const waistR = Math.sqrt(mx*mx + mz*mz);
            document.getElementById('waist-val').innerText = `R=${waistR.toFixed(2)}m`;

            if (params.showMesh) {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geo.setIndex(indices);
                geo.computeVertexNormals();
                geo.computeBoundingSphere(); 
                mainGroup.add(new THREE.Mesh(geo, meshMat));
            }

            if (params.showLines) {
                const linesA = [];
                const linesB = [];
                
                for(let j=0; j<=segs; j++) {
                     const theta = (j / segs) * Math.PI * 2;
                     const x0 = r * Math.cos(theta); const z0 = r * Math.sin(theta);

                     const ax_bot = x0*Math.cos(botRot) - z0*Math.sin(botRot);
                     const az_bot = x0*Math.sin(botRot) + z0*Math.cos(botRot);
                     const ax_top = x0*Math.cos(topRot) - z0*Math.sin(topRot);
                     const az_top = x0*Math.sin(topRot) + z0*Math.cos(topRot);
                     linesA.push(new THREE.Vector3(ax_bot, botY, az_bot));
                     linesA.push(new THREE.Vector3(ax_top, topY, az_top));

                     if (params.doubleRule) {
                         const bx_bot = x0*Math.cos(-botRot) - z0*Math.sin(-botRot);
                         const bz_bot = x0*Math.sin(-botRot) + z0*Math.cos(-botRot);
                         const bx_top = x0*Math.cos(-topRot) - z0*Math.sin(-topRot);
                         const bz_top = x0*Math.sin(-topRot) + z0*Math.cos(-topRot);
                         linesB.push(new THREE.Vector3(bx_bot, botY, bz_bot));
                         linesB.push(new THREE.Vector3(bx_top, topY, bz_top));
                     }
                }
                const geoA = new THREE.BufferGeometry().setFromPoints(linesA);
                mainGroup.add(new THREE.LineSegments(geoA, lineMatA));
                if(linesB.length > 0) {
                    const geoB = new THREE.BufferGeometry().setFromPoints(linesB);
                    mainGroup.add(new THREE.LineSegments(geoB, lineMatB));
                }
            }
        }

        function calculateWarp(verts, a, b, c, d) {
            const vA = new THREE.Vector3(verts[a*3], verts[a*3+1], verts[a*3+2]);
            const vB = new THREE.Vector3(verts[b*3], verts[b*3+1], verts[b*3+2]);
            const vC = new THREE.Vector3(verts[c*3], verts[c*3+1], verts[c*3+2]); 
            const vD = new THREE.Vector3(verts[d*3], verts[d*3+1], verts[d*3+2]); 
            const n1 = new THREE.Vector3(); new THREE.Triangle(vA, vB, vC).getNormal(n1);
            const n2 = new THREE.Vector3(); new THREE.Triangle(vA, vC, vD).getNormal(n2);
            return n1.angleTo(n2) * (180/Math.PI);
        }

        function drawPost(pos, height) {
            const ground = new THREE.Vector3(pos.x, 0, pos.z);
            const lineGeo = new THREE.BufferGeometry().setFromPoints([ground, pos]);
            mainGroup.add(new THREE.Line(lineGeo, dimLineMat));
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({color:0xffffff}));
            box.position.copy(pos);
            mainGroup.add(box);
        }

        // --- UI ---
        const pane = new Tweakpane.Pane({ title: 'Ruled Surface Engine' });
        pane.addInput(params, 'mode', { options: { 'Hypar (Saddle)': 'Hypar (Saddle)', 'Hyperboloid (Cylinder)': 'Hyperboloid (Cylinder)' } }).on('change', updateGeometry);
        
        const fDim = pane.addFolder({ title: 'Hypar Geometry' });
        fDim.addInput(params, 'width', { min: 2, max: 20 }).on('change', updateGeometry);
        fDim.addInput(params, 'length', { min: 2, max: 20 }).on('change', updateGeometry);
        fDim.addInput(params, 'hyparTwist', { min: 0, max: 10, label: 'Twist (H)' }).on('change', updateGeometry);
        
        const fCyl = pane.addFolder({ title: 'Cylinder Geometry' });
        fCyl.addInput(params, 'cylRadius', { min: 1, max: 10 }).on('change', updateGeometry);
        fCyl.addInput(params, 'cylHeight', { min: 5, max: 25, label: 'Height (H)' }).on('change', updateGeometry);
        fCyl.addInput(params, 'cylTwist', { min: 0, max: 180, label: 'Twist (°)' }).on('change', updateGeometry);
        fCyl.addInput(params, 'doubleRule', { label: 'Diagrid' }).on('change', updateGeometry);
        fCyl.addInput(params, 'snapToNodes', { label: 'Snap to Nodes' }).on('change', updateGeometry);

        const fDet = pane.addFolder({ title: 'Detail' });
        fDet.addInput(params, 'divisions', { min: 2, max: 50, step: 1 }).on('change', updateGeometry);
        fDet.addInput(params, 'opacity', { min: 0, max: 1, label: 'Opacity' }).on('change', updateGeometry);
        fDet.addInput(params, 'showMesh').on('change', updateGeometry);
        fDet.addInput(params, 'showLines').on('change', updateGeometry);
        fDet.addInput(params, 'showDims').on('change', updateGeometry);

        pane.addButton({ title: 'Download Image' }).on('click', () => {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'ruled_surface_v2.5.png';
            link.href = renderer.domElement.toDataURL();
            link.click();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        updateGeometry();
        animate();

    </script>
</body>
</html>
