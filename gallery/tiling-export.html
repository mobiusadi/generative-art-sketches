<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Wallpaper Groups</title>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
        canvas { display: block; width: 100%; height: 100%; }
        .home-btn {
            position: fixed; top: 20px; left: 20px;
            color: #fff; text-decoration: none; font-family: monospace;
            font-size: 14px; z-index: 1000; opacity: 0.8; transition: 0.3s;
            mix-blend-mode: difference; border: 1px solid rgba(255,255,255,0.5);
            padding: 5px 10px; background: rgba(0,0,0,0.2);
        }
        .home-btn:hover { opacity: 1.0; background: #fff; color: #000; }
        
        #info {
            position: fixed; bottom: 20px; left: 20px;
            color: #fff; font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.8); padding: 15px; border-left: 2px solid #00ffff;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; max-width: 300px;
        }
        #info.visible { opacity: 1; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">← Home</a>
    <div id="info"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const info = document.getElementById('info');

        // Logic Definitions for the Groups
        const GROUPS = {
            1:  { name: 'p1', desc: 'Translation only.', type: 'square' },
            2:  { name: 'pm', desc: 'Reflections.', type: 'square' },
            3:  { name: 'pg', desc: 'Glide Reflection.', type: 'square' },
            4:  { name: 'cm', desc: 'Brick Mirror.', type: 'square' },
            5:  { name: 'p2', desc: '180° Rotations.', type: 'square' },
            6:  { name: 'p4', desc: '90° Rotations.', type: 'square' },
            7:  { name: 'p4m', desc: 'Kaleidoscope.', type: 'square' },
            8:  { name: 'p3', desc: '120° Rotations.', type: 'hex' },
            9:  { name: 'p6', desc: '60° Rotations.', type: 'hex' },
            10: { name: 'p6m', desc: 'Hex Kaleidoscope.', type: 'hex' }
        };

        const params = {
            // Main Controls
            groupIndex: 1, 
            showAsymmetry: false, 
            
            // Dimensions
            cellSize: 80,      
            lineWidth: 2,
            
            // Colors
            bgColor: '#1a1a1a', 
            lineColor: '#ffffff',
            arrowColor: '#00ffff',
            domainColor: 'rgba(255, 0, 0, 0.4)', 
            
            // Geometry
            starRadius: 0.5,
            breakSymmetry: 0.0,
        };

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            draw(context); // Draw to screen
        }
        window.addEventListener('resize', resize);

        // --- DXF EXPORTER ENGINE ---
        // A "Virtual Context" that records lines instead of drawing pixels
        class DXFContext {
            constructor() {
                this.lines = [];
                this.matrix = [1, 0, 0, 1, 0, 0]; // Identity [sx, ky, kx, sy, tx, ty]
                this.stack = [];
                this.currentPath = [];
            }
            save() { this.stack.push([...this.matrix]); }
            restore() { if(this.stack.length) this.matrix = this.stack.pop(); }
            
            translate(x, y) {
                // Matrix multiplication for translation
                this.matrix[4] += this.matrix[0] * x + this.matrix[2] * y;
                this.matrix[5] += this.matrix[1] * x + this.matrix[3] * y;
            }
            scale(x, y) {
                this.matrix[0] *= x; this.matrix[1] *= x;
                this.matrix[2] *= y; this.matrix[3] *= y;
            }
            rotate(angle) {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                const m11 = this.matrix[0] * c + this.matrix[2] * s;
                const m12 = this.matrix[1] * c + this.matrix[3] * s;
                const m21 = this.matrix[0] * -s + this.matrix[2] * c;
                const m22 = this.matrix[1] * -s + this.matrix[3] * c;
                this.matrix[0] = m11; this.matrix[1] = m12;
                this.matrix[2] = m21; this.matrix[3] = m22;
            }
            beginPath() { this.currentPath = []; }
            moveTo(x, y) { this.currentPath = [this.transform(x, y)]; }
            lineTo(x, y) {
                const p = this.transform(x, y);
                if (this.currentPath.length > 0) {
                    const last = this.currentPath[this.currentPath.length - 1];
                    this.lines.push([last, p]);
                }
                this.currentPath.push(p);
            }
            closePath() {
                if (this.currentPath.length > 1) {
                    const first = this.currentPath[0];
                    const last = this.currentPath[this.currentPath.length - 1];
                    this.lines.push([last, first]);
                }
            }
            stroke() { /* No-op for DXF, we already stored lines */ }
            fill() { /* No-op for DXF */ }
            
            // Helper to apply matrix
            transform(x, y) {
                return {
                    x: x * this.matrix[0] + y * this.matrix[2] + this.matrix[4],
                    y: x * this.matrix[1] + y * this.matrix[3] + this.matrix[5]
                };
            }

            getDXF() {
                let s = "0\nSECTION\n2\nENTITIES\n";
                this.lines.forEach(l => {
                    s += "0\nLINE\n8\n0\n"; // Layer 0
                    s += `10\n${l[0].x}\n20\n${l[0].y}\n30\n0.0\n`; // Start Point
                    s += `11\n${l[1].x}\n21\n${l[1].y}\n31\n0.0\n`; // End Point
                });
                s += "0\nENDSEC\n0\nEOF";
                return s;
            }
        }

        function exportDXF() {
            const dxfCtx = new DXFContext();
            // Draw the scene into our virtual DXF recorder
            // We use a larger fixed size for export usually, but screen size is fine for patterns
            draw(dxfCtx); 
            
            const blob = new Blob([dxfCtx.getDXF()], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `pattern-group-${params.groupIndex}.dxf`;
            link.click();
        }


        // --- DRAWING LOGIC ---
        function drawArrow(ctx, size) {
            const s = size * 0.4;
            ctx.beginPath();
            ctx.moveTo(-s, s);
            ctx.lineTo(s, s);
            ctx.lineTo(s, -s);
            ctx.lineTo(0, -s);
            ctx.lineTo(0, 0);
            ctx.lineTo(-s, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Dot center
            // Only draw fill for canvas, skip for DXF to keep it clean lines
            if(ctx instanceof CanvasRenderingContext2D) {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-s/2, s/2, 3, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawStar(ctx, size, sides) {
            const radius = size * 0.5;
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (Math.PI * 2 * i) / sides - Math.PI/2;
                const nextAngle = (Math.PI * 2 * (i + 1)) / sides - Math.PI/2;
                
                const mx = (Math.cos(angle) * radius + Math.cos(nextAngle) * radius) / 2;
                const my = (Math.sin(angle) * radius + Math.sin(nextAngle) * radius) / 2;
                const midAngle = (angle + nextAngle) / 2;
                
                let currentRadius = params.starRadius;
                if (i === 0) currentRadius += params.breakSymmetry;

                const ix = Math.cos(midAngle) * (radius * currentRadius);
                const iy = Math.sin(midAngle) * (radius * currentRadius);

                if(i===0) ctx.moveTo(mx, my);
                else ctx.lineTo(mx, my);
                ctx.lineTo(ix, iy);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // --- MAIN RENDERER (Works for Screen AND DXF) ---
        function draw(ctx) {
            const grp = GROUPS[params.groupIndex];
            
            // UI Text only updates for screen context
            if (ctx === context) {
                info.innerHTML = `<strong>${params.groupIndex}. ${grp.name}</strong><br>${grp.desc}`;
                info.className = 'visible';
                
                // Clear Screen
                ctx.fillStyle = params.bgColor;
                ctx.fillRect(0, 0, width, height);
            }

            const size = params.cellSize;
            const cols = Math.ceil(width / size) + 2;
            const rows = Math.ceil(height / size) + 2;
            
            ctx.save();
            ctx.translate(width/2, height/2);

            const rangeX = Math.ceil(cols/2);
            const rangeY = Math.ceil(rows/2);

            for (let row = -rangeY; row < rangeY; row++) {
                for (let col = -rangeX; col < rangeX; col++) {
                    
                    ctx.save();

                    // --- POSITIONING ---
                    let x, y;
                    if (grp.type === 'hex') {
                        const hexH = size * 0.866;
                        x = (col * size) + (row % 2) * (size/2);
                        y = row * hexH;
                    } else {
                        x = col * size;
                        y = row * size;
                    }
                    ctx.translate(x, y);

                    // --- TRANSFORMATIONS ---
                    let isFundamental = false; 
                    
                    if (params.groupIndex === 1) { if(col===0 && row===0) isFundamental = true; }
                    if (params.groupIndex === 2) { 
                        if (col % 2 !== 0) ctx.scale(-1, 1); 
                        if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex === 3) {
                        if (row % 2 !== 0) ctx.scale(-1, 1);
                        if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex === 4) {
                        if ((col+row)%2 !== 0) ctx.scale(1, -1);
                        if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex === 5) {
                        if ((col + row) % 2 !== 0) ctx.rotate(Math.PI);
                        if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex === 6) {
                        const angle = ((Math.abs(col)%2) + (Math.abs(row)%2)*2) * (Math.PI/2);
                        ctx.rotate(angle);
                        if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex === 7) {
                         const step = (Math.abs(col)%2) + (Math.abs(row)%2)*2;
                         ctx.rotate(step * Math.PI/2);
                         if ((col+row)%2 !== 0) ctx.scale(-1, 1);
                         if(col===0 && row===0) isFundamental = true;
                    }
                    if (params.groupIndex >= 8 && grp.type === 'hex') {
                         const step = (Math.abs(col+row) % 6);
                         ctx.rotate(step * (Math.PI / 3));
                         if(col===0 && row===0) isFundamental = true;
                    }

                    // --- DRAWING ---
                    // For DXF, we ignore colors and just draw lines
                    if (ctx === context) {
                        if (params.showAsymmetry) {
                            ctx.fillStyle = isFundamental ? params.domainColor : params.arrowColor;
                            ctx.strokeStyle = params.lineColor;
                        } else {
                            ctx.strokeStyle = params.lineColor;
                        }
                        ctx.lineWidth = params.lineWidth;
                    }

                    if (params.showAsymmetry) {
                        drawArrow(ctx, size);
                    } else {
                        const sides = grp.type === 'hex' ? 6 : 4;
                        drawStar(ctx, size, sides);
                    }

                    ctx.restore();
                }
            }
            ctx.restore();
        }

        // --- CONTROLS ---
        const pane = new Tweakpane.Pane({ title: 'Symmetry Lab' });
        
        const f1 = pane.addFolder({ title: 'Theory' });
        f1.addInput(params, 'groupIndex', { min: 1, max: 10, step: 1, label: 'Select Group' }).on('change', () => draw(context));
        f1.addInput(params, 'showAsymmetry', { label: 'Show Math (L)' }).on('change', () => draw(context));
        
        const f2 = pane.addFolder({ title: 'Architecture' });
        f2.addInput(params, 'breakSymmetry', { min: 0, max: 1.0, label: 'Reveal Rotation' }).on('change', () => draw(context));
        f2.addInput(params, 'cellSize', { min: 40, max: 150 }).on('change', () => draw(context));
        f2.addInput(params, 'starRadius', { min: 0, max: 1.5 }).on('change', () => draw(context));
        
        const f3 = pane.addFolder({ title: 'Style' });
        f3.addInput(params, 'bgColor').on('change', () => draw(context));
        f3.addInput(params, 'lineColor').on('change', () => draw(context));
        
        // EXPORT BUTTON
        f3.addButton({ title: 'Download .DXF (CAD)' }).on('click', exportDXF);

        resize();

    </script>
</body>
</html>
