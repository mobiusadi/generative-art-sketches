<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Intelligence | Voronoi</title>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .home-btn {
            position: fixed; top: 20px; left: 20px;
            color: #000; text-decoration: none; font-family: monospace;
            font-size: 14px; z-index: 1000; opacity: 0.5; transition: 0.3s;
            border: 1px solid rgba(127,127,127,0.3);
            padding: 5px 10px; background: rgba(255,255,255,0.8);
        }
        .home-btn:hover { opacity: 1.0; background: #000; color: #fff; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">← Home</a>
    <canvas id="canvas"></canvas>

    <script>
        // --- 1. SEEDED RANDOM ENGINE ---
        class Random {
            constructor(seed = 12345) { this.setSeed(seed); }
            setSeed(seed) {
                this.m = 0x80000000; this.a = 1103515245; this.c = 12345;
                this.state = seed ? seed : Math.floor(Math.random() * (this.m - 1));
            }
            nextFloat() {
                this.state = (this.a * this.state + this.c) % this.m;
                return this.state / (this.m - 1);
            }
            range(min, max) { return min + this.nextFloat() * (max - min); }
        }

        // --- 2. MAIN SKETCH SETUP ---
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        const params = {
            count: 50,          
            seed: 1,            
            lineWidth: 2,       
            lineColor: '#1a1a1a', 
            backgroundColor: '#ffffff', // New: Cell Color
            showDots: false,
            dotSize: 4
        };

        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            draw(); 
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3. DRAWING LOGIC ---
        function draw() {
            const rng = new Random(params.seed);

            // Generate Points
            const points = [];
            for (let i = 0; i < params.count; i++) {
                points.push([
                    rng.range(0, width),
                    rng.range(0, height)
                ]);
            }

            // Calculate Voronoi
            const delaunay = d3.Delaunay.from(points);
            const voronoi = delaunay.voronoi([0, 0, width, height]);

            // Render Background (Cell Color)
            context.fillStyle = params.backgroundColor;
            context.fillRect(0, 0, width, height);

            // Draw Walls
            context.beginPath();
            voronoi.render(context);
            context.lineWidth = params.lineWidth;
            context.strokeStyle = params.lineColor;
            context.stroke();

            // Draw Columns (Dots)
            if (params.showDots) {
                context.fillStyle = '#ff3333';
                points.forEach(p => {
                    context.beginPath();
                    context.arc(p[0], p[1], params.dotSize, 0, Math.PI * 2);
                    context.fill();
                });
            }
        }

        // --- 4. TWEAKPANE CONTROLS ---
        const pane = new Tweakpane.Pane({ title: 'Voronoi Controls' });

        const f1 = pane.addFolder({ title: 'Geometry' });
        f1.addInput(params, 'count', { min: 5, max: 200, step: 1 }).on('change', draw);
        f1.addInput(params, 'seed', { min: 0, max: 100, step: 1 }).on('change', draw);
        f1.addButton({ title: 'Randomize' }).on('click', () => {
            params.seed = Math.floor(Math.random() * 1000);
            pane.refresh();
            draw();
        });

        const f2 = pane.addFolder({ title: 'Drafting' });
        f2.addInput(params, 'lineWidth', { min: 0.5, max: 10, step: 0.5 }).on('change', draw);
        f2.addInput(params, 'lineColor', { label: 'Lines' }).on('change', draw);
        f2.addInput(params, 'backgroundColor', { label: 'Cells' }).on('change', draw);
        
        // The "Invert" Toggle Logic
        f2.addButton({ title: 'Invert Colors 🌗' }).on('click', () => {
            const temp = params.lineColor;
            params.lineColor = params.backgroundColor;
            params.backgroundColor = temp;
            pane.refresh();
            draw();
        });

        f2.addInput(params, 'showDots').on('change', draw);
        f2.addInput(params, 'dotSize', { min: 1, max: 20 }).on('change', draw);

        f2.addButton({ title: 'Save .PNG' }).on('click', () => {
            const link = document.createElement('a');
            link.download = `voronoi-seed-${params.seed}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // Initial Draw
        draw();

    </script>
</body>
</html>
